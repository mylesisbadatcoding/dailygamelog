<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rank2.day - Daily Game Leaderboard</title>
  <meta name="description" content="Paste your daily game results and compete on a shared leaderboard.">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="scan" aria-hidden="true"></div>

  <!-- LOGIN -->
  <section id="login-screen" class="screen">
    <div id="login-cloud" aria-label="Existing usernames"></div>
    <div class="panel login">
      <img class="logo big" src="assets/logo.svg" alt="" width="64" height="64">
      <h1>rank2.day</h1>
      <p class="sub">Daily game scores. One leaderboard.</p>
      <form id="login-form" autocomplete="on">
        <p id="login-note" class="note" hidden></p>
        <label class="label" for="in-name">USERNAME</label>
        <input id="in-name" type="text" maxlength="20" placeholder="e.g. myles" autocomplete="username" required autofocus>
        <div id="signup-fields" hidden>
          <label class="label" for="in-email">EMAIL</label>
          <input id="in-email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <label class="label" for="in-pass">PASSWORD</label>
        <input id="in-pass" type="password" minlength="6" placeholder="6+ characters" autocomplete="current-password" required>
        <div id="signup-fields2" hidden>
          <label class="label" for="in-pass2">CONFIRM PASSWORD</label>
          <input id="in-pass2" type="password" minlength="6" autocomplete="new-password">
        </div>
        <button class="btn" id="login-submit" type="submit">LOG IN ▶</button>
        <p class="links">
          <button type="button" class="linkbtn" id="login-toggle">CREATE ACCOUNT</button>
          <button type="button" class="linkbtn" id="login-forgot">FORGOT PASSWORD?</button>
        </p>
        <p id="login-err" class="err" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="assets/logo.svg" alt="" width="36" height="36">
        <h1>rank2.day</h1>
      </div>
      <nav class="datenav" aria-label="Date">
        <button class="btn small" id="btn-prev" title="Previous day">◀</button>
        <input type="date" id="date-input" aria-label="Date">
        <button class="btn small" id="btn-next" title="Next day">▶</button>
        <button class="btn small ghost" id="btn-today">TODAY</button>
      </nav>
      <div class="userbar">
        <span id="sync" class="pill">OFFLINE</span>
        <button class="chip" id="btn-account" title="Account info"><span id="who"></span><small id="role-tag"></small></button>
        <button class="btn small" id="btn-crew" title="Select or add a crew code">CREW <span id="crew-tag"></span></button>
        <button class="btn small gold" id="btn-games">GAMES</button>
        <button class="btn small ghost" id="btn-crt" title="Toggle scanlines">CRT</button>
        <button class="btn small ghost" id="btn-logout">LOG OUT</button>
      </div>
    </header>

    <nav class="tabbar" role="tablist" aria-label="Views">
      <button class="tab on" data-tab="today" role="tab">TODAY</button>
      <button class="tab" data-tab="alltime" role="tab">ALL-TIME</button>
      <button class="tab" data-tab="history" role="tab">HISTORY</button>
      <button class="tab" data-tab="trends" role="tab">TRENDS</button>
      <button class="tab" data-tab="games" role="tab">BY GAME</button>
      <button class="tab" data-tab="data" role="tab">DATA</button>
    </nav>

    <main class="grid" id="view-today">
      <section class="panel" id="panel-today">
        <h2 id="today-title">TODAY'S BOARD</h2>
        <div id="today-board"></div>
        <div id="today-games" class="gcards"></div>
      </section>

      <section class="panel paste" id="panel-paste">
        <h2><span class="blink">▼</span> PASTE YOUR RESULTS <span class="blink">▼</span></h2>
        <p class="logging">Logging for: <b id="log-date"></b></p>
        <label class="sr" for="paste">Paste share text</label>
        <textarea id="paste" rows="9" spellcheck="false" placeholder="Paste Wordle, Connections, Krillion, Costcodle... one game or a whole pile at once."></textarea>
        <div class="btnrow">
          <button class="btn" id="btn-save" disabled>SAVE SCORES</button>
          <button class="btn small ghost" id="btn-clip">📋 PASTE</button>
          <button class="btn small ghost" id="btn-clear">CLEAR</button>
        </div>
        <div id="preview" aria-live="polite"></div>
      </section>

    </main>

    <section class="archive" id="view-archive" hidden>
      <div class="panel">
        <h2 id="archive-title"></h2>
        <div id="tab-body"></div>
      </div>
    </section>

    <footer class="foot">rank2.day · daily scores for real friends</footer>
  </div>

  <!-- GAMES DRAWER -->
  <div id="backdrop"></div>
  <aside id="drawer" aria-hidden="true" aria-label="Daily game links">
    <div class="dhead">
      <h2>DAILY GAMES</h2>
      <button class="btn small ghost" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <input id="link-filter" type="search" placeholder="filter games…" aria-label="Filter games">
    <div id="link-list"></div>
  </aside>

  <!-- MODAL (crew + account) -->
  <div id="modal" class="modal" hidden>
    <div class="panel modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="dhead">
        <h2 id="modal-title"></h2>
        <button class="btn small ghost" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/games.js"></script>
  <script src="js/links.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
